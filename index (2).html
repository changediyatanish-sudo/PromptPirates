<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sudoku Paradox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --cell:clamp(44px,min(9vw,11vh),66px);
    --pix:'Press Start 2P','Courier New',monospace;
    --bg:#06070d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#e8e6f0;font-family:var(--pix);touch-action:manipulation}
  body{
    min-height:100vh;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%,#fff9 50%,transparent 51%),
      radial-gradient(1px 1px at 82% 12%,#fff8 50%,transparent 51%),
      radial-gradient(1.5px 1.5px at 66% 78%,#9fd8ff99 50%,transparent 51%),
      radial-gradient(1px 1px at 28% 84%,#fff7 50%,transparent 51%),
      radial-gradient(1px 1px at 92% 58%,#fff7 50%,transparent 51%),
      radial-gradient(1px 1px at 6% 62%,#fff6 50%,transparent 51%),
      radial-gradient(ellipse at 50% 40%,#101a36 0%,#070912 60%,#04050a 100%);
  }
  #clock{position:fixed;left:50%;top:50%;width:min(130vmin,1100px);height:min(130vmin,1100px);transform:translate(-50%,-50%);opacity:.09;pointer-events:none;animation:spin 360s linear infinite}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  #clock text{fill:#cfe3ff;font-family:Georgia,serif;font-size:34px;text-anchor:middle;dominant-baseline:middle}
  #clock circle{fill:none;stroke:#cfe3ff;stroke-width:2}

  .app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:18px 12px 110px;display:flex;flex-direction:column;align-items:center;gap:14px}
  h1{margin:0;font-size:clamp(16px,3.4vw,28px);letter-spacing:2px;text-align:center;color:#fff;text-shadow:3px 3px 0 #2b3f8f,0 0 18px #6fa8ff88}
  .sub{margin:0;font-size:clamp(7px,1.4vw,10px);color:#9fb0d8;text-align:center;line-height:1.7}
  .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:clamp(8px,1.5vw,11px)}
  .chip{background:#11152a;border:2px solid #3a4680;padding:8px 10px;box-shadow:3px 3px 0 #000a}

  .stage{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;align-items:flex-start}
  .board{padding:14px 14px 10px;position:relative}
  .board h2{margin:0 0 10px;text-align:center;font-size:clamp(11px,1.9vw,15px);letter-spacing:3px}
  .board .cap{margin:10px 0 0;text-align:center;font-size:7px;line-height:1.6;opacity:.85}
  .grid{display:grid;gap:0;width:max-content;margin:0 auto}
  .cell{
    width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);font-size:calc(var(--cell)*.42);cursor:pointer;user-select:none;position:relative;
    background:var(--cbg);color:var(--ink);border:1px solid var(--cline);
  }
  .cell.bR{border-right:3px solid var(--line)}
  .cell.bB{border-bottom:3px solid var(--line)}
  .cell.peer{background:var(--peer)}
  .cell.given{background:var(--gbg);color:var(--gink)}
  .cell.placed{color:var(--placed)}
  .cell.echo{color:var(--echo);box-shadow:inset 0 0 0 2px var(--echoring)}
  .cell.ghost{outline:3px dashed var(--ghost);outline-offset:-4px}
  .cell.sel{outline:3px solid var(--sel);outline-offset:-3px;z-index:2;background:var(--selbg)}
  .cell.bad{animation:bad .45s steps(3) 1;color:#fff}
  .cell.pop{animation:pop .3s steps(3) 1}
  .cell.pulse{animation:pulse .5s steps(4) 1}
  @keyframes bad{0%,100%{background:inherit}30%,70%{background:#ff2d4d}}
  @keyframes pop{50%{transform:scale(1.22)}}
  @keyframes pulse{0%{transform:scale(.7);opacity:.3}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .board.shake{animation:shake .3s steps(4) 1}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* PAST: wood and parchment */
  .past{--cbg:#ecd9a8;--ink:#3a2210;--cline:#b99a62;--line:#5a3a1e;--peer:#e2c98f;--gbg:#d9bc7c;--gink:#2a1608;--placed:#9a3a10;--echo:#7a4a1c;--echoring:#c28f4a;--ghost:#9a3a10;--sel:#9a3a10;--selbg:#f6e7bb;
    background:linear-gradient(#6b4423,#4a2d14);border:4px solid #2a170a;box-shadow:inset 0 0 0 3px #a9773f,6px 6px 0 #000a;color:#f3deb0}
  .past h2{color:#f6e2b4;text-shadow:2px 2px 0 #2a170a}
  /* PRESENT: deep blue */
  .present{--cbg:#1b4f9c;--ink:#eaf3ff;--cline:#3b75c8;--line:#9cc7ff;--peer:#2460b8;--gbg:#123a7a;--gink:#ffffff;--placed:#9fe0ff;--echo:#7fb6ff;--echoring:#5aa0ff;--ghost:#ffe27a;--sel:#ffe27a;--selbg:#2d6fd0;
    background:linear-gradient(#143569,#0c2146);border:4px solid #06142e;box-shadow:inset 0 0 0 3px #4b8be0,6px 6px 0 #000a;color:#cfe4ff}
  .present h2{color:#d8ecff;text-shadow:2px 2px 0 #06142e}
  /* FUTURE: neon on black */
  .future{--cbg:#031a12;--ink:#7dffc9;--cline:#0f6b4a;--line:#19ff9d;--peer:#052a1d;--gbg:#06281c;--gink:#c5ffe6;--placed:#ff5ec4;--echo:#ff9ad8;--echoring:#b03a8c;--ghost:#ff5ec4;--sel:#ff5ec4;--selbg:#08382a;
    background:#020a07;border:4px solid #19ff9d;box-shadow:0 0 22px #19ff9d77,6px 6px 0 #000a;color:#7dffc9}
  .future h2{color:#9fffd6;text-shadow:0 0 10px #19ff9d}

  .rules{display:flex;flex-direction:column;gap:6px;font-size:clamp(7px,1.3vw,9px);line-height:1.7;color:#aab6dc;text-align:center}
  .rules b{color:#ffe27a}
  #msg{min-height:34px;font-size:clamp(8px,1.5vw,10px);line-height:1.7;text-align:center;color:#cfe0ff;max-width:640px}
  #msg.bad{color:#ff6b86}
  #msg.good{color:#7dffc9}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(transparent,#05060c 38%);padding:18px 10px 14px;display:flex;justify-content:center}
  .pad{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{font-family:var(--pix);font-size:14px;min-width:54px;height:54px;padding:0 12px;background:#1a2150;color:#fff;border:3px solid #6f86ff;box-shadow:4px 4px 0 #000;cursor:pointer}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
  .btn.small{font-size:10px}
  .btn.go{background:#2b8f5a;border-color:#8dffc0}

  .overlay{position:fixed;inset:0;z-index:20;background:#04050ae6;display:flex;align-items:center;justify-content:center;padding:18px}
  .overlay.hide{display:none}
  .card{max-width:560px;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
  .card h1{font-size:clamp(20px,5vw,38px)}
  .card p{margin:0;font-size:clamp(9px,1.8vw,12px);line-height:1.9;color:#c4d0f5}
  .card ol{margin:0;padding:0;list-style:none;font-size:clamp(8px,1.5vw,10px);line-height:2;color:#8fa0d6;text-align:left}
  @media (max-width:520px){
    .app{padding-bottom:150px}
    .pad{gap:6px}
    .btn{min-width:44px;height:48px;padding:0 8px;font-size:12px;box-shadow:3px 3px 0 #000}
    .btn.small{font-size:8px}
  }
  @media (prefers-reduced-motion:reduce){#clock{animation:none}.cell.bad,.cell.pop,.cell.pulse,.board.shake{animation:none}}
</style>
</head>
<body>
<svg id="clock" viewBox="-300 -300 600 600" aria-hidden="true"></svg>

<main class="app">
  <h1>SUDOKU PARADOX</h1>
  <p class="sub" id="levelline"></p>
  <div class="bar">
    <div class="chip" id="movechip">MOVES 0</div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="rules" id="rules"></div>
  <div id="msg" role="status" aria-live="polite"></div>
</main>

<div class="dock"><div class="pad" id="pad"></div></div>

<div class="overlay" id="start">
  <div class="card">
    <h1>SUDOKU PARADOX</h1>
    <p>Sudoku, but you solve Past, Present and Future at once. Every move echoes through time.</p>
    <ol>
      <li>1. Tap a cell, then pick a number.</li>
      <li>2. Your move echoes onto the other timelines.</li>
      <li>3. All three boards must be valid Sudoku.</li>
    </ol>
    <button class="btn go" id="playbtn">PLAY</button>
  </div>
</div>

<div class="overlay hide" id="win">
  <div class="card">
    <h1>TIMELINES<br>ALIGNED</h1>
    <p id="wintext"></p>
    <div class="pad">
      <button class="btn small" id="replaybtn">REPLAY</button>
      <button class="btn go small" id="nextbtn">NEXT LEVEL</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// ENGINE-START  (pure logic, no DOM; the solver test loads this block)
// ============================================================
const BOARDS = ['past', 'present', 'future'];
const BOARD_LABEL = { past: 'Past', present: 'Present', future: 'Future' };

function parseBoard(str, N) {
  return Array.from({ length: N * N }, (_, i) => {
    const ch = str[i];
    const v = (ch && ch !== '.' && ch !== '0') ? Number(ch) : 0;
    return v ? { v, kind: 'given' } : { v: 0, kind: 'empty' };
  });
}

function cloneBoards(bs) {
  const out = {};
  for (const b of BOARDS) out[b] = bs[b].map(c => ({ v: c.v, kind: c.kind }));
  return out;
}

const hasEcho = (lvl, id) => !lvl.echoes || lvl.echoes.includes(id);

// Echo chain after a placement at (b,r,c). E1: Present -> Future (shift). E2: Future -> Past (mirror).
function echoTargets(lvl, b, r, c) {
  const N = lvl.size, out = [];
  let cb = b, cc = c;
  if (cb === 'present' && hasEcho(lvl, 'E1')) { cc = (cc + lvl.shift) % N; cb = 'future'; out.push([cb, r, cc]); }
  if (cb === 'future' && hasEcho(lvl, 'E2')) { cc = N - 1 - cc; cb = 'past'; out.push([cb, r, cc]); }
  return out;
}

// First conflicting cell holding digit d in the row/column/box of (r,c), or null.
function dupAt(bs, lvl, b, r, c, d) {
  const N = lvl.size, [br, bc] = lvl.box, B = bs[b];
  for (let i = 0; i < N; i++) {
    if (i !== c && B[r * N + i].v === d) return { kind: 'row', cell: [b, r, i] };
    if (i !== r && B[i * N + c].v === d) return { kind: 'column', cell: [b, i, c] };
  }
  const r0 = r - (r % br), c0 = c - (c % bc);
  for (let i = 0; i < br; i++) for (let j = 0; j < bc; j++) {
    const rr = r0 + i, cc = c0 + j;
    if ((rr !== r || cc !== c) && B[rr * N + cc].v === d) return { kind: 'box', cell: [b, rr, cc] };
  }
  return null;
}

// Any linked pair (E1/E2) that is filled with two different digits.
function linkClash(bs, lvl) {
  const N = lvl.size;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (hasEcho(lvl, 'E1')) {
      const c2 = (c + lvl.shift) % N, a = bs.present[r * N + c], f = bs.future[r * N + c2];
      if (a.v && f.v && a.v !== f.v) return { a: ['present', r, c], b: ['future', r, c2] };
    }
    if (hasEcho(lvl, 'E2')) {
      const c2 = N - 1 - c, f = bs.future[r * N + c], p = bs.past[r * N + c2];
      if (f.v && p.v && f.v !== p.v) return { a: ['future', r, c], b: ['past', r, c2] };
    }
  }
  return null;
}

// Attempt a move. Atomic: returns {ok:false, reason, flash} or {ok:true, boards, writes}.
function tryMove(boards, lvl, b, r, c, d) {
  const N = lvl.size, idx = r * N + c;
  const origin = boards[b][idx];
  if (origin.v !== 0) return { ok: false, reason: 'That cell is locked. Use Undo (Z) to take a move back.', flash: [[b, r, c]] };

  const nb = cloneBoards(boards);
  nb[b][idx] = { v: d, kind: 'placed' };
  const writes = [[b, r, c]];

  for (const [tb, tr, tc] of echoTargets(lvl, b, r, c)) {
    const cell = nb[tb][tr * N + tc];
    if (cell.v === 0) { nb[tb][tr * N + tc] = { v: d, kind: 'echo' }; writes.push([tb, tr, tc]); }
    else if (cell.v !== d) {
      return { ok: false, reason: `Paradox! The echo hits a ${cell.v} in the ${BOARD_LABEL[tb]}.`, flash: [[b, r, c], [tb, tr, tc]] };
    }
  }
  for (const [wb, wr, wc] of writes) {
    const dup = dupAt(nb, lvl, wb, wr, wc, d);
    if (dup) return { ok: false, reason: `Paradox! A ${d} already sits in that ${dup.kind} in the ${BOARD_LABEL[wb]}.`, flash: [[wb, wr, wc], dup.cell] };
  }
  const clash = linkClash(nb, lvl);
  if (clash) return { ok: false, reason: 'Paradox! The Past, Present and Future disagree on that cell.', flash: [[b, r, c], clash.a, clash.b] };

  return { ok: true, boards: nb, writes };
}

// Full audit: every cell filled, every board valid, every link matching.
function isSolved(bs, lvl) {
  const N = lvl.size;
  for (const b of BOARDS) for (let i = 0; i < N * N; i++) {
    const v = bs[b][i].v;
    if (!v) return false;
    if (dupAt(bs, lvl, b, Math.floor(i / N), i % N, v)) return false;
  }
  return !linkClash(bs, lvl);
}

// Build the starting state: parse givens, then echo each given once into empty linked cells.
function initBoards(lvl) {
  const N = lvl.size, bs = {};
  for (const b of BOARDS) bs[b] = parseBoard(lvl.givens[b], N);
  for (const b of ['present', 'future']) {
    for (let i = 0; i < N * N; i++) {
      const cell = bs[b][i];
      if (cell.kind !== 'given') continue;
      for (const [tb, tr, tc] of echoTargets(lvl, b, Math.floor(i / N), i % N)) {
        const t = bs[tb][tr * N + tc];
        if (t.v === 0) bs[tb][tr * N + tc] = { v: cell.v, kind: 'echo' };
      }
    }
  }
  return bs;
}
// ENGINE-END

// ============================================================
// UI
// ============================================================
const FALLBACK_LEVELS = {"levels":[{"id":1,"name":"First Echo","hint":"A move in the Present echoes into the Future, then the Past.","size":4,"box":[2,2],"echoes":["E1","E2"],"shift":1,"givens":{"past":"..1..4....2.2...","present":"1..4.4....4.4..1","future":"4....3....1....2"},"solution":{"past":"3214143241232341","present":"1234341221434321","future":"4123234132141432"}}]};

const $ = id => document.getElementById(id);
const S = { levels: [], li: 0, lvl: null, boards: null, history: [], sel: null, fx: {}, won: false, started: false, cells: {} };
const SUBS = { past: 'The foundation. It mirrors the Future.', present: 'Your workspace. Moves echo onward.', future: 'Unstable. It rewrites the Past.' };

function buildClock() {
  const svg = $('clock'), ns = 'http://www.w3.org/2000/svg';
  [290, 272, 196].forEach(r => { const c = document.createElementNS(ns, 'circle'); c.setAttribute('r', r); svg.appendChild(c); });
  const nums = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
  nums.forEach((n, i) => {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', Math.cos(a) * 236); t.setAttribute('y', Math.sin(a) * 236);
    t.textContent = n; svg.appendChild(t);
  });
}

function buildPad() {
  const pad = $('pad'); pad.innerHTML = '';
  for (let d = 1; d <= S.lvl.size; d++) {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = d; b.dataset.d = d; b.setAttribute('aria-label', 'Place ' + d);
    pad.appendChild(b);
  }
  const u = document.createElement('button'); u.className = 'btn small'; u.id = 'undobtn'; u.textContent = 'UNDO'; pad.appendChild(u);
  const r = document.createElement('button'); r.className = 'btn small'; r.id = 'restartbtn'; r.textContent = 'RESTART'; pad.appendChild(r);
}

function buildBoards() {
  const { size: N, box: [br, bc] } = S.lvl, stage = $('stage');
  stage.innerHTML = ''; S.cells = {};
  for (const b of BOARDS) {
    const sec = document.createElement('section');
    sec.className = 'board ' + b; sec.dataset.b = b;
    sec.innerHTML = `<h2>${BOARD_LABEL[b].toUpperCase()}</h2>`;
    const grid = document.createElement('div');
    grid.className = 'grid'; grid.style.gridTemplateColumns = `repeat(${N}, var(--cell))`;
    S.cells[b] = [];
    for (let i = 0; i < N * N; i++) {
      const r = Math.floor(i / N), c = i % N, el = document.createElement('div');
      el.dataset.b = b; el.dataset.i = i; el.setAttribute('role', 'button');
      el.dataset.base = 'cell' + ((c + 1) % bc === 0 && c < N - 1 ? ' bR' : '') + ((r + 1) % br === 0 && r < N - 1 ? ' bB' : '');
      grid.appendChild(el); S.cells[b].push(el);
    }
    sec.appendChild(grid);
    const cap = document.createElement('p'); cap.className = 'cap'; cap.textContent = SUBS[b]; sec.appendChild(cap);
    stage.appendChild(sec);
  }
  const k = S.lvl.shift;
  $('rules').innerHTML =
    `<div><b>E1</b> Present → Future, shifted +${k} column${k > 1 ? 's' : ''} (wraps around)</div>` +
    `<div><b>E2</b> Future → Past, mirrored left ↔ right</div>`;
}

function render() {
  const N = S.lvl.size, sel = S.sel;
  const ghosts = new Set();
  if (sel) {
    ghosts.add(`${sel.b}:${sel.r * N + sel.c}`);
    for (const [tb, tr, tc] of echoTargets(S.lvl, sel.b, sel.r, sel.c)) ghosts.add(`${tb}:${tr * N + tc}`);
  }
  for (const b of BOARDS) for (let i = 0; i < N * N; i++) {
    const el = S.cells[b][i], cell = S.boards[b][i], r = Math.floor(i / N), c = i % N, key = b + ':' + i;
    let cls = el.dataset.base + ' ' + cell.kind;
    if (sel && sel.b === b) {
      if (sel.r === r && sel.c === c) cls += ' sel';
      else if (sel.r === r || sel.c === c) cls += ' peer';
    }
    if (sel && ghosts.has(key) && !(sel.b === b && sel.r === r && sel.c === c)) cls += ' ghost';
    if (S.fx[key]) cls += ' ' + S.fx[key];
    el.className = cls;
    el.textContent = cell.v || '';
  }
  $('movechip').textContent = 'MOVES ' + S.history.length;
}

function say(text, tone) { const m = $('msg'); m.textContent = text; m.className = tone || ''; }

function fx(list, cls, ms) {
  const N = S.lvl.size;
  list.forEach(([b, r, c]) => {
    const key = b + ':' + (r * N + c);
    S.fx[key] = cls;
    setTimeout(() => { if (S.fx[key] === cls) { delete S.fx[key]; render(); } }, ms);
  });
}

function shakeBoards(list) {
  new Set(list.map(x => x[0])).forEach(b => {
    const sec = document.querySelector(`.board.${b}`);
    sec.classList.remove('shake'); void sec.offsetWidth; sec.classList.add('shake');
    setTimeout(() => sec.classList.remove('shake'), 320);
  });
}

function place(d) {
  if (S.won || !S.sel) { if (!S.sel && !S.won) say('Pick a cell first.'); return; }
  const { b, r, c } = S.sel;
  const res = tryMove(S.boards, S.lvl, b, r, c, d);
  if (!res.ok) { say(res.reason, 'bad'); fx(res.flash, 'bad', 450); shakeBoards(res.flash); render(); return; }
  S.history.push(S.boards);
  S.boards = res.boards;
  fx([res.writes[0]], 'pop', 320);
  fx(res.writes.slice(1), 'pulse', 520);
  const echoed = res.writes.slice(1).map(w => BOARD_LABEL[w[0]]);
  say(echoed.length ? `Placed ${d}. It echoed into the ${echoed.join(' and the ')}.` : `Placed ${d}.`, 'good');
  render();
  if (isSolved(S.boards, S.lvl)) win();
}

function undo() {
  if (S.won || !S.history.length) { say('Nothing to undo.'); return; }
  S.boards = S.history.pop(); say('Rewound one move.'); render();
}

function restart() { loadLevel(S.li); say('Timeline reset.'); }

function win() {
  S.won = true;
  setTimeout(() => {
    $('wintext').textContent = `All three timelines are valid Sudoku. Solved in ${S.history.length} moves.`;
    $('nextbtn').style.display = S.li + 1 < S.levels.length ? '' : 'none';
    $('win').classList.remove('hide');
  }, 700);
}

function loadLevel(i) {
  S.li = i; S.lvl = S.levels[i]; S.boards = initBoards(S.lvl); S.history = []; S.sel = null; S.fx = {}; S.won = false;
  $('levelline').textContent = `LEVEL ${S.lvl.id} · ${S.lvl.name.toUpperCase()}`;
  buildBoards(); buildPad(); render(); say(S.lvl.hint || '');
  $('win').classList.add('hide');
}

function select(b, i) {
  const N = S.lvl.size; S.sel = { b, r: Math.floor(i / N), c: i % N }; render();
}

document.addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (cell) { select(cell.dataset.b, Number(cell.dataset.i)); return; }
  const btn = e.target.closest('.btn');
  if (!btn) return;
  if (btn.dataset.d) place(Number(btn.dataset.d));
  else if (btn.id === 'undobtn') undo();
  else if (btn.id === 'restartbtn') restart();
  else if (btn.id === 'replaybtn') restart();
  else if (btn.id === 'nextbtn') loadLevel(S.li + 1);
  else if (btn.id === 'playbtn') { S.started = true; $('start').classList.add('hide'); }
});

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (!S.started) { if (k === 'Enter' || k === ' ') { S.started = true; $('start').classList.add('hide'); e.preventDefault(); } return; }
  const N = S.lvl.size;
  if (/^[1-9]$/.test(k) && Number(k) <= N) { place(Number(k)); return; }
  if (k === 'z' || k === 'Z') { undo(); return; }
  if (k === 'r' || k === 'R') { restart(); return; }
  if (k === 'Backspace' || k === 'Delete' || k === '0') { say('No erase. Use Undo (Z) to take a move back.'); return; }
  const dir = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
  if (dir) {
    e.preventDefault();
    if (!S.sel) { select('present', 0); return; }
    const r = Math.min(N - 1, Math.max(0, S.sel.r + dir[0])), c = Math.min(N - 1, Math.max(0, S.sel.c + dir[1]));
    select(S.sel.b, r * N + c);
  }
});

async function init() {
  buildClock();
  let data = FALLBACK_LEVELS;
  try { const res = await fetch('levels.json', { cache: 'no-store' }); if (res.ok) data = await res.json(); } catch (_) { /* file:// or offline: use embedded copy */ }
  S.levels = data.levels;
  loadLevel(0);
}
init();
</script>
</body>
